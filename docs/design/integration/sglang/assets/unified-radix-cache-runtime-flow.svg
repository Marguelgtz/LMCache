<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1420" aria-labelledby="title description" role="img" viewBox="0 120 1760 1420"><title id="title">Unified LMCache Radix Cache asynchronous request flow</title><desc id="description">A sequence diagram showing lookup and prefetch, admission and retrieve, forward and publish, and asynchronous store across the SGLang scheduler, unified radix cache, multiprocess connector, LMCache server, and CUDA forward stream.</desc><defs><linearGradient id="lookup-band" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient><linearGradient id="retrieve-band" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#F5F3FF"/><stop offset="1" stop-color="#FBFAFF"/></linearGradient><linearGradient id="forward-band" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ECFDF5"/><stop offset="1" stop-color="#F8FFFC"/></linearGradient><linearGradient id="store-band" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FFF7ED"/><stop offset="1" stop-color="#FFFCF8"/></linearGradient><filter id="shadow" width="140%" height="170%" x="-20%" y="-30%"><feDropShadow dx="0" dy="7" flood-color="#0F172A" flood-opacity=".13" stdDeviation="10"/></filter><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#334155" d="M 0 0 L 9 5 L 0 10 z"/></marker><marker id="arrow-blue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#2563EB" d="M 0 0 L 9 5 L 0 10 z"/></marker><marker id="arrow-green" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#059669" d="M 0 0 L 9 5 L 0 10 z"/></marker><marker id="arrow-orange" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#EA580C" d="M 0 0 L 9 5 L 0 10 z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.lane{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 9;opacity:.62}.arrow,.async{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.async{stroke:#2563eb;stroke-dasharray:9 7;marker-end:url(#arrow-blue)}.event,.store{fill:none;stroke:#059669;stroke-width:3.5;marker-end:url(#arrow-green)}.store{stroke:#ea580c;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow-orange)}.label{font-size:17px;font-weight:650;fill:#1e293b}.small{font-size:14px;font-weight:550;fill:#64748b}.phase{font-size:14px;font-weight:800;letter-spacing:1.4px}</style></defs><rect width="1760" height="1540" fill="#F8FAFC"/><g class="sans" filter="url(#shadow)"><g><rect width="230" height="78" x="145" y="150" fill="#FFF" rx="15"/><rect width="230" height="7" x="145" y="150" fill="#2563EB" rx="4"/><circle cx="181" cy="190" r="19" fill="#DBEAFE"/><text x="181" y="196" fill="#1D4ED8" font-size="17" font-weight="800" text-anchor="middle">S</text><text x="210" y="187" fill="#0F172A" font-size="18" font-weight="760">Scheduler</text><text x="210" y="209" fill="#64748B" font-size="13">SGLang control plane</text></g><g><rect width="230" height="78" x="455" y="150" fill="#FFF" rx="15"/><rect width="230" height="7" x="455" y="150" fill="#0D9488" rx="4"/><circle cx="491" cy="190" r="19" fill="#CCFBF1"/><text x="491" y="196" fill="#0F766E" font-size="17" font-weight="800" text-anchor="middle">R</text><text x="520" y="187" fill="#0F172A" font-size="18" font-weight="760">Radix Cache</text><text x="520" y="209" fill="#64748B" font-size="13">Unified GPU metadata</text></g><g><rect width="230" height="78" x="765" y="150" fill="#FFF" rx="15"/><rect width="230" height="7" x="765" y="150" fill="#7C3AED" rx="4"/><circle cx="801" cy="190" r="19" fill="#EDE9FE"/><text x="801" y="196" fill="#6D28D9" font-size="17" font-weight="800" text-anchor="middle">C</text><text x="830" y="187" fill="#0F172A" font-size="18" font-weight="760">MP Connector</text><text x="830" y="209" fill="#64748B" font-size="13">IPC and rank sync</text></g><g><rect width="230" height="78" x="1075" y="150" fill="#FFF" rx="15"/><rect width="230" height="7" x="1075" y="150" fill="#EA580C" rx="4"/><circle cx="1111" cy="190" r="19" fill="#FFEDD5"/><text x="1111" y="196" fill="#C2410C" font-size="17" font-weight="800" text-anchor="middle">L</text><text x="1140" y="187" fill="#0F172A" font-size="18" font-weight="760">LMCache Server</text><text x="1140" y="209" fill="#64748B" font-size="13">L1 and L2 storage</text></g><g><rect width="230" height="78" x="1385" y="150" fill="#FFF" rx="15"/><rect width="230" height="7" x="1385" y="150" fill="#059669" rx="4"/><circle cx="1421" cy="190" r="19" fill="#D1FAE5"/><text x="1421" y="196" fill="#047857" font-size="17" font-weight="800" text-anchor="middle">G</text><text x="1450" y="187" fill="#0F172A" font-size="18" font-weight="760">Forward Stream</text><text x="1450" y="209" fill="#64748B" font-size="13">CUDA execution</text></g></g><rect width="1720" height="355" x="20" y="250" fill="url(#lookup-band)" stroke="#BFDBFE" rx="20"/><rect width="1720" height="280" x="20" y="620" fill="url(#retrieve-band)" stroke="#DDD6FE" rx="20"/><rect width="1720" height="190" x="20" y="915" fill="url(#forward-band)" stroke="#A7F3D0" rx="20"/><rect width="1720" height="350" x="20" y="1120" fill="url(#store-band)" stroke="#FED7AA" rx="20"/><g class="sans"><rect width="190" height="30" x="39" y="267" fill="#DBEAFE" rx="15"/><text x="134" y="287" fill="#1D4ED8" class="phase" text-anchor="middle">01 · LOOKUP + PREFETCH</text><rect width="190" height="30" x="39" y="637" fill="#EDE9FE" rx="15"/><text x="134" y="657" fill="#6D28D9" class="phase" text-anchor="middle">02 · RETRIEVE(H2D)</text><rect width="190" height="30" x="39" y="932" fill="#D1FAE5" rx="15"/><text x="134" y="952" fill="#047857" class="phase" text-anchor="middle">03 · EXECUTE</text><rect width="190" height="30" x="39" y="1137" fill="#FFEDD5" rx="15"/><text x="134" y="1157" fill="#C2410C" class="phase" text-anchor="middle">04 · STORE(D2H)</text></g><line x1="260" x2="260" y1="228" y2="1452" class="lane"/><line x1="570" x2="570" y1="228" y2="1452" class="lane"/><line x1="880" x2="880" y1="228" y2="1452" class="lane"/><line x1="1190" x2="1190" y1="228" y2="1452" class="lane"/><line x1="1500" x2="1500" y1="228" y2="1452" class="lane"/><g class="sans"><path d="M270 320 H558" class="arrow"/><rect width="182" height="30" x="323" y="302" fill="#FFF" rx="15"/><text x="414" y="322" class="label" text-anchor="middle">Local prefix match</text><path d="M580 375 H868" class="async"/><rect width="148" height="30" x="650" y="357" fill="#FFF" rx="15"/><text x="724" y="377" class="label" text-anchor="middle">Async LOOKUP</text><path d="M890 430 H1178" class="async"/><rect width="178" height="30" x="945" y="412" fill="#FFF" rx="15"/><text x="1034" y="432" class="label" text-anchor="middle">Lookup + prefetch</text><path d="M260 468 C205 468 205 514 260 514" class="arrow"/><rect width="171" height="31" x="55" y="476" fill="#FFF" rx="15"/><text x="140" y="497" class="label" text-anchor="middle">Enter waiting queue</text><rect width="408" height="67" x="521" y="520" fill="#FFF" stroke="#93C5FD" stroke-dasharray="7 6" stroke-width="2" rx="18"/><path d="M580 554 H868" class="async"/><text x="724" y="547" class="label" text-anchor="middle">Poll prefetch status</text><text x="724" y="573" class="mono small" text-anchor="middle">check_prefetch_progress()</text><rect width="45" height="22" x="537" y="536" fill="#2563EB" rx="11"/><text x="559" y="552" fill="#FFF" font-size="11" font-weight="800" text-anchor="middle">LOOP</text></g><g class="sans"><path d="M270 680 H558" class="arrow"/><rect width="204" height="30" x="312" y="662" fill="#FFF" rx="15"/><text x="414" y="682" class="label" text-anchor="middle">Re-match + admission</text><path d="M570 715 C630 715 630 760 570 760" class="arrow"/><rect width="178" height="31" x="592" y="722" fill="#FFF" rx="15"/><text x="681" y="743" class="label" text-anchor="middle">Allocate GPU slots</text><path d="M580 795 H868" class="async"/><rect width="164" height="30" x="642" y="777" fill="#FFF" rx="15"/><text x="724" y="797" class="label" text-anchor="middle">Async RETRIEVE</text><path d="M890 845 H1178" class="async"/><rect width="156" height="30" x="956" y="827" fill="#FFF" rx="15"/><text x="1034" y="847" class="label" text-anchor="middle">LMCache → GPU</text><path d="M1202 880 H1488" class="event"/><rect width="186" height="30" x="1252" y="862" fill="#FFF" rx="15"/><text x="1345" y="882" class="label" text-anchor="middle">Completion event wait</text></g><g class="sans"><path d="M1500 958 C1570 958 1570 1002 1500 1002" class="event"/><rect width="167" height="31" x="1400" y="965" fill="#FFF" rx="15"/><text x="1483" y="986" class="label" text-anchor="middle">Model forward</text><path d="M270 1050 H558" class="arrow"/><rect width="182" height="30" x="323" y="1032" fill="#FFF" rx="15"/><text x="414" y="1052" class="label" text-anchor="middle">Publish prefix to tree</text></g><g class="sans"><path d="M580 1185 H868" class="store"/><rect width="158" height="30" x="645" y="1167" fill="#FFF" rx="15"/><text x="724" y="1187" class="label" text-anchor="middle">Async STORE suffix</text><path d="M890 1240 H1178" class="store"/><rect width="166" height="30" x="951" y="1222" fill="#FFF" rx="15"/><text x="1034" y="1242" class="label" text-anchor="middle">Persist new chunks</text><path d="M570 1270 C650 1270 650 1320 570 1320" class="arrow"/><rect width="238" height="31" x="592" y="1280" fill="#FFF" rx="15"/><text x="711" y="1301" class="mono label" text-anchor="middle">check_hicache_events()</text><path d="M570 1340 C650 1340 650 1390 570 1390" class="arrow"/><rect width="274" height="31" x="592" y="1350" fill="#FFF" rx="15"/><text x="729" y="1371" class="label" text-anchor="middle">Release locks + pending state</text><path d="M890 1440 H1178" class="store"/><rect width="140" height="30" x="964" y="1422" fill="#FFF" rx="15"/><text x="1034" y="1442" class="mono label" text-anchor="middle">END_SESSION</text><text x="1034" y="1463" class="small" text-anchor="middle">after final store</text></g><g class="sans"><rect width="786" height="25" x="487" y="1500" fill="#E2E8F0" rx="12.5"/><text x="880" y="1517" fill="#475569" font-size="13.5" font-weight="600" text-anchor="middle">GPU slots are allocated only after admission · CUDA events guard data readiness</text></g></svg>